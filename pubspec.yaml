name: leve
description: "Leve: Hábitos & Diário — seu companheiro calmo para uma vida leve."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Charts
  fl_chart: ^0.70.2

  # Monetization (RevenueCat)
  purchases_flutter: ^8.0.0

  # Typography & Design
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
